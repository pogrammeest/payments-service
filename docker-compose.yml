x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/${POSTGRES_DB:-payments}
  RABBIT_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
  API_KEY: ${API_KEY:-dev-api-key}
  GATEWAY_URL: http://gateway-mock:8001

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway-mock:
    build: .
    command: uvicorn gateway_mock.main:app --host 0.0.0.0 --port 8001
    environment:
      GATEWAY_SUCCESS_RATE: ${GATEWAY_SUCCESS_RATE:-0.9}
      GATEWAY_ERROR_RATE: ${GATEWAY_ERROR_RATE:-0.0}
      GATEWAY_DELAY_MIN: ${GATEWAY_DELAY_MIN:-2}
      GATEWAY_DELAY_MAX: ${GATEWAY_DELAY_MAX:-5}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumer:
    build: .
    command: faststream run app.consumer.main:app
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy  # миграции накатывает api при старте
      rabbitmq:
        condition: service_healthy
      gateway-mock:
        condition: service_healthy

  # приёмник webhook для демо, пишет запросы в лог (--profile demo)
  webhook-receiver:
    image: mendhak/http-https-echo:35
    profiles: ["demo"]
    environment:
      HTTP_PORT: 8080
    expose:
      - "8080"

volumes:
  pgdata:

[project]
name = "payments-service"
version = "0.1.0"
description = "Async payment processing service: FastAPI + PostgreSQL + RabbitMQ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "faststream[rabbit,cli]>=0.5.39,<0.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "gateway_mock*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
